name: Build patches

# One-click build.
# Actions -> "Build patches" -> "Run workflow" -> download the .mpp artifact.
on:
  workflow_dispatch:

permissions:
  contents: read
  # Needed to read the Morphe plugin/libraries from GitHub Packages.
  packages: read

jobs:
  build:
    name: Build .mpp
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so the commit SHA used to name the artifact is accurate.
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build patches bundle
        env:
          # settings.gradle.kts resolves 'app.morphe.patches' from GitHub
          # Packages, which requires authentication even for public artifacts.
          # The automatic token is sufficient for read access.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Try buildAndroid (used by upstream) first, fallback to build.
          # buildAndroid avoids running lintDebug which previously failed due to
          # NotificationPermission in the shared extension.
          if ./gradlew tasks --all | grep -q "buildAndroid"; then
            ./gradlew buildAndroid --stacktrace
          else
            ./gradlew build --stacktrace
          fi

      - name: Collect artifact
        id: collect
        run: |
          set -euo pipefail

          mkdir -p dist

          # Keep the real bundle, drop the -sources / -javadoc siblings.
          mapfile -t bundles < <(
            find patches/build/libs -name 'patches-*.mpp' \
              ! -name '*sources*' ! -name '*javadoc*' | sort
          )

          if [ "${#bundles[@]}" -eq 0 ]; then
            echo "::error::No .mpp was produced. Contents of patches/build/libs:"
            ls -la patches/build/libs || echo "  (directory does not exist)"
            exit 1
          fi

          cp "${bundles[@]}" dist/

          echo "Built:"
          ls -la dist/

          # Name the artifact after the commit it was built from.
          echo "name=piko-patches-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload .mpp
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.name }}
          path: dist/*.mpp
          if-no-files-found: error
          retention-days: 30
