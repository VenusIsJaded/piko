name: Debug Build
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with logs
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log; echo "EXIT_CODE=${PIPESTATUS[0]}" >> build.log
          ./gradlew lint --stacktrace 2>&1 | tee -a build.log || true
          ls -la patches/build/libs 2>&1 | tee -a build.log || true
          find . -path "*/build/reports/*" -type f 2>&1 | tee -a build.log || true
          for f in $(find . -path "*lint-results*" -type f 2>/dev/null | head -n 20); do echo "=== $f ==="; cat "$f" | head -n 500; done 2>&1 | tee -a build.log || true
          cat build.log | tail -n 1000

      - name: Commit log
        run: |
          git config user.name "debug-bot"
          git config user.email "debug@example.com"
          git add build.log
          git commit -m "debug: add build log" || echo "no changes"
          git push origin HEAD:main || echo "push failed"

      - name: Upload log artifact (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
