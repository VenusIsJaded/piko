name: Debug Build
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with logs
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log; echo "EXIT_CODE=${PIPESTATUS[0]}" >> build.log
          echo "=== LINT ===" >> build.log
          ./gradlew lint --stacktrace 2>&1 | tee -a build.log || true
          echo "=== LIBS ===" >> build.log
          ls -la patches/build/libs 2>&1 | tee -a build.log || true
          echo "=== REPORTS ===" >> build.log
          find . -path "*/build/reports/*" -type f 2>&1 | tee -a build.log || true
          echo "=== LINT RESULTS ===" >> build.log
          for f in $(find . -path "*lint-results*" -type f 2>/dev/null | head -n 20); do echo "=== $f ===" >> build.log; cat "$f" | head -n 2000 >> build.log; done || true
          echo "=== BUILD LOG TAIL ===" >> build.log
          tail -n 2000 build.log

      - name: Push log to debug-logs branch
        if: always()
        run: |
          git config user.name "debug-bot"
          git config user.email "debug@example.com"
          # Create orphan branch or checkout debug-logs
          git checkout --orphan debug-logs || git checkout debug-logs
          git rm -rf . || true
          mv build.log ./build.log || true
          ls -la
          git add build.log
          git commit -m "debug log $(date)" || echo "no changes"
          git push origin HEAD:debug-logs --force || echo "push failed"
          git checkout main

      - name: Upload log artifact (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
